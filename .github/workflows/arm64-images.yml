# Home-lab addition (not in upstream): build linux/arm64 images for the Raspberry Pi.
# Upstream only publishes amd64 images. This is a separate file so merges from upstream
# never conflict with it. Run manually:
#   gh workflow run arm64-images.yml -f ref=v0.37.0 -f version=0.37.0
name: arm64-images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or SHA to build (e.g. v0.37.0)"
        required: true
        default: master
      version:
        description: "Image tag to publish (e.g. 0.37.0); also becomes the assembly version"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native arm64 runner (free for public repos) - no QEMU emulation of the .NET build.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: src/CalCrony.Api/Dockerfile }
          - { name: bot, dockerfile: src/CalCrony.Bot/Dockerfile }
          - { name: web, dockerfile: src/CalCrony.Web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Lowercase image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          build-args: VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/${{ env.OWNER }}/calcrony-${{ matrix.name }}:${{ inputs.version }}
            ghcr.io/${{ env.OWNER }}/calcrony-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
